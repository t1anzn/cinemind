services:
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_DB: cinemind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinemind"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SQLALCHEMY_DATABASE_URI=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/cinemind
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_NAME=cinemind
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "sleep 5 && cd migration_project && alembic upgrade head && cd .. && python app/app.py"

  frontend:
    build: ./frontend
    environment:
      - BACKEND_URL=http://backend:5000
      - PORT=3000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
